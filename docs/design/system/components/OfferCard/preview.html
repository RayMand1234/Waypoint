<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OfferCard — preview</title>
<style>body{margin:0;padding:16px;background:var(--surface);} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} </style></head>
<body class="wp">
<div style="display:grid;gap:12px;max-width:400px">
  <button class="wp-offer wp-offer--best" aria-pressed="true">
    <div class="wp-offer__head"><span class="wp-badge wp-badge--value">★ Best value</span><span class="wp-badge wp-badge--neutral">Direct</span></div>
    <div><p class="wp-offer__title">TAP Air Portugal</p><p class="wp-offer__meta">TLV 07:40 → LIS 11:25 · 4h 45m · 1 bag</p></div>
    <div class="wp-offer__foot"><div><div class="wp-offer__price">€ 189</div><div class="wp-offer__unit">per person, all fees</div></div><span class="wp-delta">−€84 vs avg</span></div>
  </button>
  <button class="wp-offer" aria-pressed="false">
    <div class="wp-offer__head"><span class="wp-badge wp-badge--warning">3 seats left</span></div>
    <div><p class="wp-offer__title">Lufthansa</p><p class="wp-offer__meta">TLV 06:10 → LIS 13:50 · 1 stop · 8h 40m</p></div>
    <div class="wp-offer__foot"><div><div class="wp-offer__price">€ 214</div><div class="wp-offer__unit">per person, all fees</div></div><span class="wp-delta wp-delta--up">+€25 vs best</span></div>
  </button>
</div>
</body>
</html>
