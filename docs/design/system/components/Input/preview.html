<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Input — preview</title>
<style>body{margin:0;padding:16px;background:var(--surface);} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} </style></head>
<body class="wp">
<div style="display:grid;gap:16px;grid-template-columns:1fr 1fr;max-width:560px">
  <label class="wp-field"><span class="wp-field__label">Where to?</span>
    <input class="wp-input" placeholder="City, country or region" value="Lisbon"><span class="wp-field__help">Or let us suggest by budget</span></label>
  <label class="wp-field"><span class="wp-field__label">Travelers</span>
    <input class="wp-input" aria-invalid="true" value="0"><span class="wp-field__error">Add at least 1 traveler</span></label>
</div>
</body>
</html>
