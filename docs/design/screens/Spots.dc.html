<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waypoint — Step 3, spots, length and dates</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/waypoint/tokens.css">
<link rel="stylesheet" href="ds/waypoint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0}a{color:var(--midnight-900)}a:hover{color:var(--midnight-700)}
.wp-route-trail{stroke-dasharray:100 100;stroke-dashoffset:66.667;animation:wp-trail .9s cubic-bezier(.5,0,.2,1) .25s both}
@keyframes wp-trail{from{stroke-dashoffset:83.333}to{stroke-dashoffset:66.667}}
.wp-route-marker{position:absolute;left:0;top:0;width:16px;height:16px;box-sizing:border-box;border-radius:999px;background:#ffc83d;border:2.5px solid #1e2a5a;offset-path:path("M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28");offset-rotate:0deg;offset-anchor:center;offset-distance:33.333%;animation:wp-glide .9s cubic-bezier(.5,0,.2,1) .25s both,wp-pulse 2s ease-out 1.4s infinite}
@keyframes wp-glide{from{offset-distance:16.667%}to{offset-distance:33.333%}}
@keyframes wp-pulse{0%{box-shadow:0 0 0 0 rgba(255,200,61,.7)}100%{box-shadow:0 0 0 10px rgba(255,200,61,0)}}
.wp-route-now{animation:wp-fade .4s ease-out 1s both}
@keyframes wp-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wp-route-trail,.wp-route-now{animation:none}
.wp-route-marker{animation:wp-pulse 2s ease-out .6s infinite}
main>*{animation:wp-in .5s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(1){animation-delay:.08s}main>*:nth-child(2){animation-delay:.16s}main>*:nth-child(3){animation-delay:.24s}main>*:nth-child(4){animation-delay:.32s}main>*:nth-child(5){animation-delay:.4s}main>*:nth-child(6){animation-delay:.48s}
@keyframes wp-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wp-route-trail,.wp-route-marker,.wp-route-now,main>*{animation:none}}
</style>
</helmet>
<div class="wp" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Destination.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font: 600 14px/20px var(--font-sans); color: var(--ink)">Lisbon</span>
      <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="3" aria-label="Step 3 of 6, Spots and dates" style="position: relative; height: 68px">
      <svg width="358" height="68" viewBox="0 0 358 68" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible">
        <path d="M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28" fill="none" stroke="#8c857a" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 7"></path>
        <path class="wp-route-trail" d="M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28" pathLength="100" fill="none" stroke="#1e2a5a" stroke-width="3" stroke-linecap="round"></path>
        <circle cx="12" cy="28" r="5" fill="#1e2a5a"></circle>
        <circle cx="67" cy="42" r="5" fill="#1e2a5a"></circle>
        <circle cx="122" cy="28" r="6" fill="#ffffff" stroke="#1e2a5a" stroke-width="2"></circle>
        <circle cx="177" cy="42" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="232" cy="28" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="287" cy="42" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="342" cy="28" r="7" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle><circle cx="342" cy="28" r="2.5" fill="#8c857a"></circle>
      </svg>
      <span class="wp-route-marker"></span>
      <span style="position: absolute; top: 52px; left: -4px; font: 500 11px/14px var(--font-sans); color: var(--ink-muted); white-space: nowrap">Views +2</span>
      <span style="position: absolute; top: 52px; left: 37px; width: 60px; text-align: center; font: 500 11px/14px var(--font-sans); color: var(--ink-muted); white-space: nowrap">Lisbon</span>
      <span class="wp-route-now" style="position: absolute; top: 2px; left: 72px; width: 100px; text-align: center; font: 700 12px/14px var(--font-sans); color: var(--ink); white-space: nowrap">Spots &amp; dates</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 16px; overflow: hidden">
    <h1 style="margin: 0; font: 700 24px/32px var(--font-sans); letter-spacing: -0.01em; color: var(--ink)">When, and what to see?</h1>

    <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px">
      <label class="wp-field"><span class="wp-field__label">Dates</span>
        <span style="position: relative; display: block"><span style="position: absolute; left: 12px; top: 14px; color: var(--ink-muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span><input class="wp-input" value="12 – 16 May" style="padding-left: 40px"></span></label>
      <label class="wp-field"><span class="wp-field__label">Travelers</span>
        <span style="position: relative; display: block"><span style="position: absolute; left: 12px; top: 14px; color: var(--ink-muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.5 3.2-5 6-5s5.2 1.5 6 5M16 4.5a3.5 3.5 0 010 7M18 15c1.6.6 2.6 2.2 3 5"></path></svg></span><input class="wp-input" value="2 adults" style="padding-left: 40px"></span></label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font: 600 14px/20px var(--font-sans); color: var(--ink)">How long?</span>
      <div role="radiogroup" aria-label="Trip length" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--midnight-100)">
        <sc-for list="{{lengths}}" as="l" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px">
      <h2 style="margin: 0; font: 600 17px/24px var(--font-sans); color: var(--ink)">Recommended spots</h2>
      <span style="font: 600 12px/16px var(--font-sans); color: var(--midnight-900)">{{fitLabel}}</span>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 20px; background: var(--surface-card); border: 1px solid var(--border); overflow: hidden">
      <sc-for list="{{spots}}" as="s" hint-placeholder-count="6">
        <li style="border-top: 1px solid var(--border); margin-top: -1px">
          <button aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px; border: none; background: transparent; cursor: pointer; text-align: start; font-family: var(--font-sans)">
            <span style="{{s.box}}"><sc-if value="{{s.on}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font: 600 15px/22px var(--font-sans); color: var(--ink)">{{s.name}}</span>
              <span style="font: 500 12px/16px var(--font-sans); color: var(--ink-muted)">{{s.meta}}</span>
            </span>
            <sc-if value="{{s.top}}" hint-placeholder-val="{{false}}"><span class="wp-badge wp-badge--neutral">Top pick</span></sc-if>
          </button>
        </li>
      </sc-for>
    </ul>
  </main>

  <footer style="padding: 12px 16px 24px; background: var(--surface-card); border-top: 1px solid var(--border); box-shadow: var(--shadow-bar); display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font: 500 12px/16px var(--font-sans); color: var(--ink-muted)">{{countLabel}}</span>
      <span style="font: 700 18px/24px var(--font-sans); color: var(--ink)">{{daysLabel}}</span>
    </div>
    <a class="wp-btn wp-btn--primary" href="Go3.dc.html" style="text-decoration: none">Build my plan</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { len: 5, on: { castle: true, monte: true, belem: true, sintra: true, market: true, tram: false, lx: false, roca: true } }; }
  renderVals() {
    var self = this;
    var lengths = [3, 5, 7, 10].map(function (n) {
      var on = self.state.len === n;
      return { label: n + ' days', on: on, pick: function () { self.setState({ len: n }); },
        style: 'min-height:44px;border:none;border-radius:8px;cursor:pointer;font:600 14px/20px var(--font-sans);' + (on ? 'background:#ffffff;color:#1e2a5a;box-shadow:0 1px 2px rgba(18,23,38,0.12);' : 'background:transparent;color:#5e5a55;') };
    });
    var list = [
      { id: 'castle', name: 'Castelo de São Jorge', meta: 'Views · Culture · 2h', top: true },
      { id: 'monte', name: 'Miradouro da Senhora do Monte', meta: 'Views · Best at sunset · 45m', top: true },
      { id: 'belem', name: 'Belém Tower & Jerónimos', meta: 'Culture · 3h', top: true },
      { id: 'sintra', name: 'Sintra — Pena Palace', meta: 'Day trip · Views · 6h', top: false },
      { id: 'market', name: 'Time Out Market', meta: 'Food · 1h 30m', top: false },
      { id: 'tram', name: 'Tram 28 through Alfama', meta: 'Culture · 1h', top: false },
      { id: 'lx', name: 'LX Factory', meta: 'Food · Culture · 2h', top: false },
      { id: 'roca', name: 'Cabo da Roca', meta: 'Views · Sunset · 2h', top: false }
    ];
    var count = 0;
    var spots = list.map(function (s) {
      var on = !!self.state.on[s.id];
      if (on) count++;
      return Object.assign({}, s, { on: on,
        box: 'width:24px;height:24px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;' + (on ? 'background:#1e2a5a;' : 'border:1.5px solid #8c857a;background:#ffffff;'),
        pick: function () { var n = Object.assign({}, self.state.on); n[s.id] = !n[s.id]; self.setState({ on: n }); } });
    });
    var fits = count <= self.state.len * 2;
    return { lengths: lengths, spots: spots,
      fitLabel: fits ? 'Fits in ' + self.state.len + ' days' : 'Too many for ' + self.state.len + ' days',
      countLabel: count + ' spots selected',
      daysLabel: 'Lisbon · ' + self.state.len + ' days' };
  }
}
</script>
</body>
</html>
