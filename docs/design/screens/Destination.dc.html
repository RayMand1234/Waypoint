<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waypoint — Step 2, destination</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/waypoint/tokens.css">
<link rel="stylesheet" href="ds/waypoint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0}a{color:var(--midnight-900)}a:hover{color:var(--midnight-700)}
.wp-route-trail{stroke-dasharray:100 100;stroke-dashoffset:83.333;animation:wp-trail .9s cubic-bezier(.5,0,.2,1) .25s both}
@keyframes wp-trail{from{stroke-dashoffset:100}to{stroke-dashoffset:83.333}}
.wp-route-marker{position:absolute;left:0;top:0;width:16px;height:16px;box-sizing:border-box;border-radius:999px;background:#ffc83d;border:2.5px solid #1e2a5a;offset-path:path("M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28");offset-rotate:0deg;offset-anchor:center;offset-distance:16.667%;animation:wp-glide .9s cubic-bezier(.5,0,.2,1) .25s both,wp-pulse 2s ease-out 1.4s infinite}
@keyframes wp-glide{from{offset-distance:0%}to{offset-distance:16.667%}}
@keyframes wp-pulse{0%{box-shadow:0 0 0 0 rgba(255,200,61,.7)}100%{box-shadow:0 0 0 10px rgba(255,200,61,0)}}
.wp-route-now{animation:wp-fade .4s ease-out 1s both}
@keyframes wp-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wp-route-trail,.wp-route-now{animation:none}
.wp-route-marker{animation:wp-pulse 2s ease-out .6s infinite}
main>*{animation:wp-in .5s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(1){animation-delay:.08s}main>*:nth-child(2){animation-delay:.16s}main>*:nth-child(3){animation-delay:.24s}main>*:nth-child(4){animation-delay:.32s}main>*:nth-child(5){animation-delay:.4s}main>*:nth-child(6){animation-delay:.48s}
@keyframes wp-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wp-route-trail,.wp-route-marker,.wp-route-now,main>*{animation:none}}
</style>
</helmet>
<div class="wp" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Style.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font: 600 14px/20px var(--font-sans); color: var(--ink)">New waypoint</span>
      <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="2" aria-label="Step 2 of 6, Destination" style="position: relative; height: 68px">
      <svg width="358" height="68" viewBox="0 0 358 68" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible">
        <path d="M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28" fill="none" stroke="#8c857a" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 7"></path>
        <path class="wp-route-trail" d="M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28" pathLength="100" fill="none" stroke="#1e2a5a" stroke-width="3" stroke-linecap="round"></path>
        <circle cx="12" cy="28" r="5" fill="#1e2a5a"></circle>
        <circle cx="67" cy="42" r="6" fill="#ffffff" stroke="#1e2a5a" stroke-width="2"></circle>
        <circle cx="122" cy="28" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="177" cy="42" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="232" cy="28" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="287" cy="42" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="342" cy="28" r="7" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle><circle cx="342" cy="28" r="2.5" fill="#8c857a"></circle>
      </svg>
      <span class="wp-route-marker"></span>
      <span style="position: absolute; top: 52px; left: -4px; font: 500 11px/14px var(--font-sans); color: var(--ink-muted); white-space: nowrap">Views +2</span>
      <span class="wp-route-now" style="position: absolute; top: 16px; left: 17px; width: 100px; text-align: center; font: 700 12px/14px var(--font-sans); color: var(--ink); white-space: nowrap">Destination</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 16px 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font: 700 24px/32px var(--font-sans); letter-spacing: -0.01em; color: var(--ink)">Where to?</h1>
      <p style="margin: 0; font: 400 15px/22px var(--font-sans); color: var(--ink-muted)">Picked for views, culture and food, flying from Tel Aviv.</p>
    </div>

    <label style="position: relative; display: block">
      <span style="position: absolute; left: 14px; top: 14px; color: var(--ink-muted)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>
      <input class="wp-input" aria-label="Search a city or country" placeholder="Already know? Search a city or country" style="padding-left: 44px">
    </label>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font: 600 17px/24px var(--font-sans); color: var(--ink)">Suggested for you</h2>
      <span style="font: 500 12px/16px var(--font-sans); color: var(--ink-muted)">Est. for 2 · 5 days</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{places}}" as="d" hint-placeholder-count="4">
        <button aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="{{d.style}}">
          <span style="{{d.thumb}}">
            <svg width="96" height="104" viewBox="0 0 96 104" aria-hidden="true" style="position: absolute; inset: 0"><circle cx="22" cy="78" r="5" fill="{{d.dot}}"></circle><circle cx="46" cy="56" r="5" fill="{{d.dot}}"></circle><circle cx="70" cy="34" r="5" fill="none" stroke="{{d.dot}}" stroke-width="2"></circle></svg>
            <span style="position: relative; font: 800 15px/1 var(--font-sans); letter-spacing: 0.02em">{{d.code}}</span>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px 12px 12px 0">
            <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <span style="font: 600 17px/24px var(--font-sans); color: var(--ink)">{{d.name}}</span>
              <sc-if value="{{d.best}}" hint-placeholder-val="{{false}}"><span class="wp-badge wp-badge--value">★ Best value</span></sc-if>
            </span>
            <span style="font: 400 13px/18px var(--font-sans); color: var(--ink-muted)">{{d.meta}}</span>
            <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 2px">
              <span style="font: 700 18px/24px var(--font-sans); font-variant-numeric: tabular-nums; color: var(--ink)">{{d.price}}</span>
              <span style="font: 600 12px/16px var(--font-sans); color: {{d.whyColor}}">{{d.why}}</span>
            </span>
          </span>
        </button>
      </sc-for>
    </div>
  </main>

  <footer style="padding: 12px 16px 24px; background: var(--surface-card); border-top: 1px solid var(--border); box-shadow: var(--shadow-bar); display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font: 500 12px/16px var(--font-sans); color: var(--ink-muted)">Going to</span>
      <span style="font: 700 18px/24px var(--font-sans); color: var(--ink)">{{chosen}}</span>
    </div>
    <a class="wp-btn wp-btn--primary" href="Go2.dc.html" style="text-decoration: none">Choose spots</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'lis' }; }
  renderVals() {
    var self = this;
    var list = [
      { id: 'lis', code: 'LIS', name: 'Lisbon, Portugal', meta: 'Direct · 5h 10m · Viewpoints, old town, food', price: '€ 880', why: 'Best match for your styles', whyColor: '#1d7a50', best: true, bg: '#fff3d1', dot: '#1e2a5a' },
      { id: 'ath', code: 'ATH', name: 'Athens, Greece', meta: 'Direct · 1h 55m · Ruins, rooftops, food', price: '€ 760', why: 'Cheapest · fewer viewpoints', whyColor: '#5e5a55', best: false, bg: '#e7eaf5', dot: '#1e2a5a' },
      { id: 'opo', code: 'OPO', name: 'Porto, Portugal', meta: '1 stop · 7h 20m · River views, wine, culture', price: '€ 940', why: '+€60 vs Lisbon', whyColor: '#5e5a55', best: false, bg: '#e7eaf5', dot: '#1e2a5a' },
      { id: 'rom', code: 'FCO', name: 'Rome, Italy', meta: 'Direct · 3h 25m · Museums, piazzas, food', price: '€ 1,120', why: '+€240 vs Lisbon', whyColor: '#5e5a55', best: false, bg: '#e7eaf5', dot: '#1e2a5a' }
    ];
    var chosen = '';
    var places = list.map(function (d) {
      var on = self.state.sel === d.id;
      if (on) chosen = d.name;
      var bg = d.best ? '#fff3d1' : '#ffffff';
      return Object.assign({}, d, {
        on: on,
        style: 'display:flex;gap:12px;align-items:stretch;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;text-align:start;font-family:var(--font-sans);background:' + bg + ';' + (on ? 'border:2px solid #1e2a5a;box-shadow:0 4px 16px rgba(18,23,38,0.10);' : 'border:1px solid ' + (d.best ? '#ffc83d' : '#e6e1d8') + ';margin:1px;box-shadow:0 1px 2px rgba(18,23,38,0.06);'),
        thumb: 'position:relative;width:96px;flex:none;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;color:#1e2a5a;background:' + (d.best ? '#ffc83d' : '#e7eaf5') + ';',
        pick: function () { self.setState({ sel: d.id }); }
      });
    });
    return { places: places, chosen: chosen };
  }
}
</script>
</body>
</html>
