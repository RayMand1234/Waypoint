<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waypoint — Step 1, trip style</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/waypoint/tokens.css">
<link rel="stylesheet" href="ds/waypoint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>body{margin:0}a{color:var(--midnight-900)}a:hover{color:var(--midnight-700)}
.wp-route-trail{stroke-dasharray:100 100;stroke-dashoffset:100}
.wp-route-marker{position:absolute;left:0;top:0;width:16px;height:16px;box-sizing:border-box;border-radius:999px;background:#ffc83d;border:2.5px solid #1e2a5a;offset-path:path("M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28");offset-rotate:0deg;offset-anchor:center;offset-distance:0%;animation:wp-drop .6s cubic-bezier(.3,1.4,.5,1) .2s both,wp-pulse 2s ease-out 1.2s infinite}
@keyframes wp-drop{from{transform:translateY(-14px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes wp-pulse{0%{box-shadow:0 0 0 0 rgba(255,200,61,.7)}100%{box-shadow:0 0 0 10px rgba(255,200,61,0)}}
.wp-route-now{animation:wp-fade .4s ease-out .6s both}
@keyframes wp-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wp-route-trail,.wp-route-now{animation:none}
.wp-route-marker{animation:wp-pulse 2s ease-out .6s infinite}
main>*{animation:wp-in .5s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(1){animation-delay:.08s}main>*:nth-child(2){animation-delay:.16s}main>*:nth-child(3){animation-delay:.24s}main>*:nth-child(4){animation-delay:.32s}main>*:nth-child(5){animation-delay:.4s}main>*:nth-child(6){animation-delay:.48s}
@keyframes wp-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wp-route-trail,.wp-route-marker,.wp-route-now,main>*{animation:none}}
</style>
</helmet>
<div class="wp" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font: 600 14px/20px var(--font-sans); color: var(--ink)">New waypoint</span>
      <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" aria-label="Step 1 of 6, Trip style" style="position: relative; height: 68px">
      <svg width="358" height="68" viewBox="0 0 358 68" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible">
        <path d="M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28" fill="none" stroke="#8c857a" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 7"></path>
        <path class="wp-route-trail" d="M12 28 C39.5 28 39.5 42 67 42 C94.5 42 94.5 28 122 28 C149.5 28 149.5 42 177 42 C204.5 42 204.5 28 232 28 C259.5 28 259.5 42 287 42 C314.5 42 314.5 28 342 28" pathLength="100" fill="none" stroke="#1e2a5a" stroke-width="3" stroke-linecap="round"></path>
        <circle cx="12" cy="28" r="6" fill="#ffffff" stroke="#1e2a5a" stroke-width="2"></circle>
        <circle cx="67" cy="42" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="122" cy="28" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="177" cy="42" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="232" cy="28" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="287" cy="42" r="5" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle>
        <circle cx="342" cy="28" r="7" fill="#faf8f4" stroke="#8c857a" stroke-width="2"></circle><circle cx="342" cy="28" r="2.5" fill="#8c857a"></circle>
      </svg>
      <span class="wp-route-marker"></span>
      <span class="wp-route-now" style="position: absolute; top: 2px; left: -4px; font: 700 12px/14px var(--font-sans); color: var(--ink); white-space: nowrap">Trip style</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font: 700 24px/32px var(--font-sans); letter-spacing: -0.01em; color: var(--ink)">What kind of trip?</h1>
      <p style="margin: 0; font: 400 15px/22px var(--font-sans); color: var(--ink-muted)">Pick everything that fits. We'll match destinations and spots to it.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{styles}}" as="s" hint-placeholder-count="8">
        <button aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.style}}">
          <span style="display: flex; justify-content: space-between; align-items: center; width: 100%">
            <span style="font: 600 15px/22px var(--font-sans); color: var(--ink)">{{s.label}}</span>
            <sc-if value="{{s.pressed}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1e2a5a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
          </span>
          <span style="font: 500 12px/16px var(--font-sans); color: var(--ink-muted)">{{s.hint}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font: 600 14px/20px var(--font-sans); color: var(--ink)">Pace</span>
      <div role="radiogroup" aria-label="Pace" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: var(--midnight-100)">
        <sc-for list="{{paces}}" as="p" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
        </sc-for>
      </div>
    </div>
  </main>

  <footer style="padding: 12px 16px 24px; background: var(--surface-card); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px">
    <span style="font: 500 12px/16px var(--font-sans); color: var(--ink-muted); text-align: center">{{countLabel}}</span>
    <a class="wp-btn wp-btn--primary wp-btn--block" href="Go1.dc.html" style="text-decoration: none">Continue to destination</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: { views: true, culture: true, food: true }, pace: 'balanced' }; }
  renderVals() {
    var list = [
      { id: 'chill', label: 'Chill & slow', hint: 'Cafés, parks, no rush' },
      { id: 'trails', label: 'Trails & hikes', hint: 'Marked tracks, nature' },
      { id: 'views', label: 'Beautiful views', hint: 'Viewpoints, sunsets' },
      { id: 'culture', label: 'Culture & history', hint: 'Museums, old towns' },
      { id: 'food', label: 'Food & markets', hint: 'Local dishes, markets' },
      { id: 'beach', label: 'Beaches', hint: 'Sea, sun, swimming' },
      { id: 'night', label: 'Nightlife', hint: 'Bars, live music' },
      { id: 'family', label: 'Family-friendly', hint: 'Easy days, kids welcome' }
    ];
    var self = this, picked = this.state.picked;
    var base = 'display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:76px;padding:12px;border-radius:12px;cursor:pointer;text-align:start;font-family:var(--font-sans);';
    var styles = list.map(function (s) {
      var on = !!picked[s.id];
      return Object.assign({}, s, {
        pressed: on,
        style: base + (on ? 'background:#e7eaf5;border:2px solid #1e2a5a;padding:11px;' : 'background:#ffffff;border:1px solid #e6e1d8;'),
        pick: function () { var n = Object.assign({}, self.state.picked); n[s.id] = !n[s.id]; self.setState({ picked: n }); }
      });
    });
    var count = styles.filter(function (s) { return s.pressed; }).length;
    var paces = [{ id: 'relaxed', label: 'Relaxed' }, { id: 'balanced', label: 'Balanced' }, { id: 'packed', label: 'Packed' }].map(function (p) {
      var on = self.state.pace === p.id;
      return Object.assign({}, p, {
        on: on,
        style: 'min-height:44px;border:none;border-radius:8px;cursor:pointer;font:600 14px/20px var(--font-sans);' + (on ? 'background:#ffffff;color:#1e2a5a;box-shadow:0 1px 2px rgba(18,23,38,0.12);' : 'background:transparent;color:#5e5a55;'),
        pick: function () { self.setState({ pace: p.id }); }
      });
    });
    return { styles: styles, paces: paces, countLabel: count + (count === 1 ? ' style selected' : ' styles selected') };
  }
}
</script>
</body>
</html>
